[project]
name = "multi-cloud-ai-soc"
version = "0.1.0"
description = "Multi-cloud AI Security Operations Center"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.1,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "aliyun-log-python-sdk>=0.9.53,<1.0",
    "tencentcloud-sdk-python-common>=3.1.207,<4.0",
    "tencentcloud-sdk-python-cls>=3.1.207,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
